name: release

on:
  push:
    tags: [ 'v[1-9]+.*' ]
  workflow_dispatch:
    inputs:
      which-pypi:
        description: 'Which Python package index?'
        required: true
        type: choice
        options:
          - pypi
          - testpypi
        default: testpypi

env:
  DISTRIBUTIONS_PATH: '.auxiliary/artifacts/hatch-build'

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  check-if-release:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.decide.outputs.is-release }}
    steps:

      - name: Checkout Sources
        uses: actions/checkout@v6

      - name: Determine Release Eligibility
        id: decide
        shell: python
        run: |
          import re
          from os import environ
          from pathlib import Path
          init = Path( 'sources/mimeogram/__init__.py' ).read_text( )
          package_version = re.search(
              r"^__version__ = '([^']+)'", init, re.M ).group( 1 )
          ref = environ[ 'GITHUB_REF' ]
          ref_name = environ[ 'GITHUB_REF_NAME' ]
          is_release = 'true'
          reason = 'Publication is allowed for non-tag workflow dispatch.'
          if ref.startswith( 'refs/tags/' ):
              tag_version = ref_name[ 1: ] if ref_name.startswith( 'v' ) else ref_name
              if tag_version == package_version:
                  reason = f"Tag version {tag_version} matches package version."
              else:
                  is_release = 'false'
                  reason = f"Tag version {tag_version} does not match package version {package_version}; test and report only."
          with open( environ[ 'GITHUB_OUTPUT' ], 'a', encoding = 'utf-8' ) as file:
              print( f"is-release={is_release}", file = file )
          with open( environ[ 'GITHUB_STEP_SUMMARY' ], 'a', encoding = 'utf-8' ) as file:
              print( '## Release Eligibility', file = file )
              print( f"- Package version: `{package_version}`", file = file )
              print( f"- Is release: `{is_release}`", file = file )
              print( f"- Reason: {reason}", file = file )

  test:
    needs: [initialize]
    uses: emcd/python-project-common/.github/workflows/xrepo--tester.yaml@gha-1
    with:
      matrix-exclusions: '${{ needs.initialize.outputs.matrix-exclusions }}'
      platforms: '${{ needs.initialize.outputs.platforms }}'
      python-descriptors: '${{ needs.initialize.outputs.python-descriptors }}'
      python-versions: '${{ needs.initialize.outputs.python-versions }}'

  report:
    needs: [initialize, test]
    uses: emcd/python-project-common/.github/workflows/xrepo--reporter.yaml@gha-1
    with:
      python-version: '${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}'

  docsgen:
    if: ${{ needs.check-if-release.outputs.is-release == 'true' }}
    needs: [check-if-release, initialize, report]
    permissions:
      contents: write
      id-token: write
      pages: write
    uses: emcd/python-project-common/.github/workflows/xrepo--documenter.yaml@gha-1
    with:
      include-reports: true
      python-version: '${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}'

  package:
    if: ${{ needs.check-if-release.outputs.is-release == 'true' }}
    needs: [check-if-release, initialize]
    uses: emcd/python-project-common/.github/workflows/xrepo--packager.yaml@gha-1
    with:
      artifacts-path: '.auxiliary/artifacts/hatch-build' # TODO: Use environment.
      python-version: '${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}'

  check-if-publish:
    needs: [package, test, report, docsgen]
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.decide.outputs.package-version }}
      should-publish: ${{ steps.decide.outputs.should-publish }}
      tag-version: ${{ steps.decide.outputs.tag-version }}
    steps:

      - name: Restore Distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions--${{ github.run_id }}
          path: ${{ env.DISTRIBUTIONS_PATH }}

      - name: Determine Publication Eligibility
        id: decide
        shell: python
        run: |
          from email import message_from_bytes
          from os import environ
          from pathlib import Path
          from zipfile import ZipFile

          distributions = Path( environ[ 'DISTRIBUTIONS_PATH' ] )
          wheels = sorted( distributions.glob( '*.whl' ) )
          if len( wheels ) != 1:
              raise SystemExit( f"Expected one wheel in {distributions}, found {len( wheels )}." )
          with ZipFile( wheels[ 0 ] ) as archive:
              names = tuple(
                  name for name in archive.namelist( )
                  if name.endswith( '.dist-info/METADATA' ) )
              if len( names ) != 1:
                  raise SystemExit( f"Expected one METADATA file in {wheels[ 0 ]}, found {len( names )}." )
              metadata = message_from_bytes( archive.read( names[ 0 ] ) )
          package_version = metadata[ 'Version' ]
          ref = environ[ 'GITHUB_REF' ]
          ref_name = environ[ 'GITHUB_REF_NAME' ]
          should_publish = 'true'
          tag_version = ''
          reason = 'Publication is allowed for non-tag workflow dispatch.'
          if ref.startswith( 'refs/tags/' ):
              tag_version = ref_name[ 1: ] if ref_name.startswith( 'v' ) else ref_name
              if tag_version == package_version:
                  reason = f"Tag version {tag_version} matches package version."
              else:
                  should_publish = 'false'
                  reason = f"Tag version {tag_version} does not match package version {package_version}."
          with open( environ[ 'GITHUB_OUTPUT' ], 'a', encoding = 'utf-8' ) as file:
              print( f"package-version={package_version}", file = file )
              print( f"should-publish={should_publish}", file = file )
              print( f"tag-version={tag_version}", file = file )
          with open( environ[ 'GITHUB_STEP_SUMMARY' ], 'a', encoding = 'utf-8' ) as file:
              print( '## Publication Eligibility', file = file )
              print( f"- Package version: `{package_version}`", file = file )
              if tag_version:
                  print( f"- Tag version: `{tag_version}`", file = file )
              print( f"- Should publish: `{should_publish}`", file = file )
              print( f"- Reason: {reason}", file = file )

  publish-pypi:
    if: ${{ needs.check-if-publish.outputs.should-publish == 'true' && (inputs.which-pypi == 'testpypi' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [initialize, package, check-if-publish]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.which-pypi || 'pypi' }}
      url: ${{ fromJSON(needs.initialize.outputs.pypi-package-urls)[inputs.which-pypi || 'pypi'] }}mimeogram
    permissions:
      id-token: write  # Only needed for PyPI trusted publishing
    steps:

      - name: Restore Distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions--${{ github.run_id }}
          path: ${{ env.DISTRIBUTIONS_PATH }}

      - name: Publish Distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.DISTRIBUTIONS_PATH }}
          repository-url: ${{ fromJSON(needs.initialize.outputs.pypi-api-urls)[inputs.which-pypi || 'pypi'] }}
          print-hash: true
          skip-existing: ${{ inputs.which-pypi == 'testpypi' }}

  create-executables:
      needs: [initialize, package]
      strategy:
        matrix:
          include:
            - os: ubuntu-22.04 # Earlier version for better Glibc compatibility.
              platform-name: linux-x86_64
            - os: ubuntu-22.04-arm # Earlier version for better Glibc compatibility.
              platform-name: linux-aarch64
            - os: windows-latest
              platform-name: windows-x86_64
            - os: macos-15-intel
              platform-name: macos-x86_64
            - os: macos-latest
              platform-name: macos-arm64
      runs-on: ${{ matrix.os }}
      env:
        _PYI_EXECUTABLE_NAME: mimeogram-${{ github.ref_name }}-${{ matrix.platform-name }}
      steps:
        - name: Prepare Python
          uses: emcd/python-project-common/.github/actions/python-hatch@gha-1
          with:
            python-version: ${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}

        # - name: Install UPX (Linux)  # Pre-installed on GHA Ubuntu runners
        #   if: ${{ runner.os == 'Linux' }}
        #   run: sudo apt-get install --yes upx

        - name: Install UPX (macOS)
          if: ${{ runner.os == 'macOS' }}
          run: brew install upx

        - name: Install UPX (Windows)
          if: ${{ runner.os == 'Windows' }}
          run: choco install upx

        - name: Create Executable
          run: |
            hatch --env develop run \
              pyinstaller \
                --clean --distpath=.auxiliary/artifacts/pyinstaller \
                pyinstaller.spec
          shell: bash

        - name: Validate Executable (simple help)
          # TODO: Validate executable on Windows.
          #       Need to find feasible way to address:
          #         https://github.com/tartley/colorama/issues/319
          if: ${{ runner.os != 'Windows' }}
          run: |
            set -eu -o pipefail
            .auxiliary/artifacts/pyinstaller/${_PYI_EXECUTABLE_NAME} --help
            .auxiliary/artifacts/pyinstaller/${_PYI_EXECUTABLE_NAME} apply --help
            .auxiliary/artifacts/pyinstaller/${_PYI_EXECUTABLE_NAME} create --help
          shell: bash

        - name: Validate Executable (commands)
          run: |
            set -eu -o pipefail
            .auxiliary/artifacts/pyinstaller/${_PYI_EXECUTABLE_NAME} \
              create --clipboard False sources/mimeogram/__init__.py >validate.mg
            .auxiliary/artifacts/pyinstaller/${_PYI_EXECUTABLE_NAME} \
              apply --clipboard False --review-mode silent <validate.mg
            rm validate.mg
          shell: bash

        - name: Save Executable
          uses: actions/upload-artifact@v7
          with:
            name: executables--${{ matrix.platform-name }}--${{ github.run_id }}
            path: .auxiliary/artifacts/pyinstaller/mimeogram-*

  publish-github:
    if: ${{ always() && needs.check-if-publish.outputs.should-publish == 'true' && needs.package.result == 'success' && needs.publish-pypi.result == 'success' && needs.create-executables.result == 'success' }}
    needs:
      - initialize
      - package
      - check-if-publish
      - publish-pypi
      # --- BEGIN: Injected by Copier ---
      - create-executables
      # --- END: Injected by Copier ---
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:

      - name: Prepare Python
        uses: emcd/python-project-common/.github/actions/python-hatch@gha-1
        with:
          python-version: ${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}

      - name: Restore Distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions--${{ github.run_id }}
          path: ${{ env.DISTRIBUTIONS_PATH }}

      - name: Restore Executables
        uses: actions/download-artifact@v8
        with:
          pattern: executables--*--${{ github.run_id }}
          path: ${{ env.DISTRIBUTIONS_PATH }}
          merge-multiple: true

      - name: Generate Integrity Check Values
        run: |
          set -eu -o pipefail
          cd ${{ env.DISTRIBUTIONS_PATH }}
          # Hatchling normalizes both wheels and sdists to underscores
          # (PEP 625), so the underscore form matches all artifacts.
          sha256sum mimeogram-* >SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.DISTRIBUTIONS_PATH }}/SHA256SUMS.txt
            ${{ env.DISTRIBUTIONS_PATH }}/mimeogram-*

      - name: Generate Release Notes
        run: |
          set -eu -o pipefail
          hatch --env develop run \
            towncrier build --draft --version ${GITHUB_REF_NAME} \
            >.auxiliary/artifacts/tc-release-notes.rst
          cat \
            documentation/executables.rst \
            .auxiliary/artifacts/tc-release-notes.rst \
            >.auxiliary/artifacts/release-notes.rst

      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_flags=( )
          if [[ "${{ github.ref_name }}" =~ ^v?[0-9]+(\.[0-9]+)*(a|b|rc)[0-9]+$ ]]; then
            release_flags+=( --prerelease --latest=false )
          fi
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --notes-file .auxiliary/artifacts/release-notes.rst \
            "${release_flags[@]}"

      - name: Publish Artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.ref_name }}' \
            ${{ env.DISTRIBUTIONS_PATH }}/* \
            --repo '${{ github.repository }}'
